import com.vanniktech.maven.publish.Checksum
import com.vanniktech.maven.publish.DeploymentValidation
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'java'
    id 'application'
    id 'com.google.cloud.tools.jib' version '3.5.2' // https://plugins.gradle.org/plugin/com.google.cloud.tools.jib
    id 'com.gradleup.shadow' version '9.3.1' // https://plugins.gradle.org/plugin/com.gradleup.shadow
    id 'jacoco'
    // https://mvnrepository.com/artifact/com.vanniktech/gradle-maven-publish-plugin
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

repositories {
    mavenCentral()
}

application.mainClass.set 'deb.simple.cli.SimpleDebApplication'

version = file('version.txt').text.trim()
group = 'info.ankin.projects'
jar.manifest.attributes(['Implementation-Version': version])

sourceSets {
    genSchema {
        runtimeClasspath += main.runtimeClasspath + main.output
        compileClasspath += main.compileClasspath + main.output
    }
}

// lombok
configurations {
    testAnnotationProcessor.extendsFrom annotationProcessor
    testCompileOnly.extendsFrom compileOnly
    genSchemaImplementation.extendsFrom implementation
    genSchemaAnnotationProcessor.extendsFrom annotationProcessor
    genSchemaCompileOnly.extendsFrom compileOnly

    implementation {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.7')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.7')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.2')
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.0.2')

    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:ssm'

    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.pgpainless:pgpainless-core:2.0.3'
    implementation 'org.pgpainless:pgpainless-sop:2.0.3'

    implementation 'org.slf4j:jcl-over-slf4j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'com.google.jimfs:jimfs:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Source: https://mvnrepository.com/artifact/com.github.victools/jsonschema-generator
    // https://github.com/victools/jsonschema-generator
    genSchemaImplementation 'com.github.victools:jsonschema-generator:5.0.0'
    genSchemaImplementation 'com.github.victools:jsonschema-module-jakarta-validation:5.0.0'
    genSchemaImplementation 'com.github.victools:jsonschema-module-jackson:5.0.0'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('assemble').get().dependsOn tasks.register('ghaCopyFilesLibs', Copy) {
    from tasks.named('shadowJar')
    into 'build/public'
}

tasks.named('assemble').get().dependsOn tasks.register('ghaCopyFilesSrcPublic', Copy) {
    from 'src/public'
    into 'build/public'
}

def buildDebConfig = tasks.register('buildDebConfig') {
    def o = layout.buildDirectory.dir('debConfig').map { it.file('debConfig.yaml') }
    def versionValue = version
    def sourcePathValue = "build/libs/simple-deb-4j-${version}-all.jar"
    outputs.file o
    doLast {
        o.get().asFile.text = """
                meta:
                  name: simple-deb-4j
                  arch: all
                  version: ${versionValue}
                control:
                  depends: ""
                  recommends: ""
                  section: ""
                  priority: ""
                  homepage: ""
                  maintainer: "simple-deb-4j"
                  description: "simple-deb-4j"
                files:
                  controlFiles: []
                  dataFiles:
                    - type: text
                      path: /usr/bin/simple-deb-4j
                      content: "#!/usr/bin/env bash\\njava -jar /usr/bin/simple-deb-4j.jar \\"\$@\\""
                      mode: 0x755
                    - type: file
                      path: /usr/bin/simple-deb-4j.jar
                      sourcePath: "${sourcePathValue}"
                """
    }
}

def buildDeb = tasks.register('buildDeb', JavaExec) {
    dependsOn buildDebConfig, 'shadowJar'

    inputs.file buildDebConfig.map { it.outputs.files.singleFile }
    inputs.property 'version', version
    inputs.file tasks.named('shadowJar').map { it.outputs.files.singleFile }
    outputs.dir layout.buildDirectory.dir('deb')

    mainClass = application.mainClass.get()
    classpath = sourceSets.main.runtimeClasspath
    args = ['build', '-c', layout.buildDirectory.file('debConfig/debConfig.yaml').get().asFile.path, '-o', 'build/deb']
}

tasks.build.dependsOn buildDeb
tasks.assemble.dependsOn buildDeb

// https://gradleup.com/shadow/publishing/
shadow { addShadowVariantIntoJavaComponent = false }

java {
    // withJavadocJar()
    withSourcesJar()
}

/*
https://vanniktech.github.io/gradle-maven-publish-plugin/central/#secrets

scp ${somewhere_safe}:~/.ssh/maven-central.* ~/.ssh/

export ORG_GRADLE_PROJECT_mavenCentralUsername=$(cat ~/.ssh/maven-central.token.xml | grep -m1 -oP '(?<=<username>).*?(?=</username>)')
export ORG_GRADLE_PROJECT_mavenCentralPassword=$(cat ~/.ssh/maven-central.token.xml | grep -m1 -oP '(?<=<password>).*?(?=</password>)')
export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat ~/.ssh/maven-central.key.pgp)"

ORG_GRADLE_PROJECT_signingInMemoryKeyId=12345678            # Optional
ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=some_password # If key was created with a password.
*/
if (['mavenCentralUsername', 'mavenCentralPassword', 'signingInMemoryKey'].every {
    project.providers.gradleProperty(it).isPresent()
}) {
    mavenPublishing {
        publishToMavenCentral(true, DeploymentValidation.VALIDATED)
        signAllPublications()

        checksums(Checksum.MD5, Checksum.SHA1, Checksum.SHA512) // requirements + good hash
        excludeSignatureChecksums(false)

        configureBasedOnAppliedPlugins(new JavadocJar.Empty(), new SourcesJar.Sources())

        pom {
            name = project.name
            description = project.description ?: project.name
            url = 'https://github.com/alexanderankin/simple-deb-4j'

            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }

            developers {
                developer {
                    id = 'alexanderankin'
                    name = 'David Ankin'
                }
            }

            scm {
                url = 'https://github.com/alexanderankin/simple-deb-4j'
                connection = 'scm:git:https://github.com/alexanderankin/simple-deb-4j.git'
                developerConnection = 'scm:git:ssh://git@github.com/alexanderankin/simple-deb-4j.git'
            }
        }
    }
}

/*
